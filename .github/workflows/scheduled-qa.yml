name: Scheduled Analytics Simulator & Quality Audit

on:
  schedule:
    # Runs daily at 02:00 UTC (reproducible nightly audit)
    - cron: '0 2 * * *'
  # Allows triggering manually from the GitHub Actions dashboard with custom parameters
  workflow_dispatch:
    inputs:
      journey_count:
        description: 'Number of synthetic journeys to execute'
        required: false
        default: '50'
      seed_offset:
        description: 'Base seed for deterministic pseudo-random generator'
        required: false
        default: '1000'

concurrency:
  group: scheduled-analytics-simulator
  cancel-in-progress: true

jobs:
  simulate-and-audit:
    name: Run Synthetic Journeys & Quality Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Analytics Quality Gate Matrix
        run: npm run test:analytics-gate
        env:
          CI: true

      - name: Upload Scheduled Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-analytics-quality-report
          path: reports/
          retention-days: 30
